[project]
name = "chronos2-pipeline"
version = "0.1.0"
description = "DIMER pipeline for zero-shot time-series forecasting with a pinned Amazon Chronos-2 checkpoint"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kurt Valcorza" }]
keywords = ["time-series", "forecasting", "chronos", "dimer", "zero-shot"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "chronos-forecasting==2.3.1",
    # Upstream 2.3.1 was reviewed against the Transformers 4 code path. Constraining
    # to <5 keeps the resolved stack identical to what the reviewer inspected.
    "transformers>=4.56,<5",
    "huggingface-hub>=0.34",
    "numpy>=1.26",
    "pandas>=2.2",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.urls]
Homepage = "https://github.com/kurtvalcorza/chronos-2-forecasting-pipeline"
Issues = "https://github.com/kurtvalcorza/chronos-2-forecasting-pipeline/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronos2_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the real pinned Chronos-2 weights and network access on first run",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
