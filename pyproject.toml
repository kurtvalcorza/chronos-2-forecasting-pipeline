[project]
name = "chronos2-pipeline"
version = "0.1.0"
description = "DIMER pipeline for zero-shot time-series forecasting with a pinned Amazon Chronos-2 checkpoint"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kurt Valcorza" }]
keywords = ["time-series", "forecasting", "chronos", "dimer", "zero-shot"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
# Runtime dependencies are pinned exactly (DIMER NOTEBOOK_SPEC 1.1 ENV2/PAR2): the standalone
# tutorial notebook carries these same pins inline, and the versions are the ones
# requirements.lock.txt resolved. Upstream chronos-forecasting 2.3.1 was reviewed against the
# Transformers 4 code path; the pin keeps that stack.
dependencies = [
    "chronos-forecasting==2.3.1",
    "transformers==4.57.6",
    "huggingface-hub==0.36.2",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "torchaudio==2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.urls]
Homepage = "https://github.com/kurtvalcorza/chronos-2-forecasting-pipeline"
Issues = "https://github.com/kurtvalcorza/chronos-2-forecasting-pipeline/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronos2_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the real pinned Chronos-2 weights and network access on first run",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells execute independently and the tutorial bootstrap intentionally keeps
# stdlib imports grouped for readability. Runtime correctness is enforced by the
# executable notebook CI gate rather than import-order cosmetics.
"*.ipynb" = ["I001"]
