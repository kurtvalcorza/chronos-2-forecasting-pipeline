name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"

jobs:
  lint-and-unit:
    name: Lint and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install the locked environment
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run ruff check .

      # No network, no model weights. These must pass on every push and PR.
      - name: Contract and unit tests
        run: uv run pytest -m "not integration"

  integration:
    name: CPU smoke against the pinned weights
    # Downloads ~478 MB of weights, so it does not run on every PR. It is the
    # only job that checks the pinned upstream contract still holds, so it must
    # run before anything ships from main.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install the locked environment
        run: uv sync --locked --extra dev

      # Keyed on the pinned revision: a pin change must miss the cache.
      - name: Cache the Hugging Face hub snapshot
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-amazon-chronos-2-95a9710e2596287d08352589f42634fa5abdf0a7
          restore-keys: hf-amazon-chronos-2-

      - name: Integration tests (CPU)
        run: uv run pytest -m integration
