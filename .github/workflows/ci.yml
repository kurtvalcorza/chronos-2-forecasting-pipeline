name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"

jobs:
  lint-and-unit:
    name: Lint and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install the locked environment
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Contract and unit tests
        run: uv run pytest -m "not integration"

  integration:
    name: CPU live tutorial against pinned weights
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install the locked environment
        run: uv sync --locked --extra dev

      - name: Cache the Hugging Face hub snapshot
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-amazon-chronos-2-95a9710e2596287d08352589f42634fa5abdf0a7
          restore-keys: hf-amazon-chronos-2-

      - name: Integration tests (CPU)
        run: uv run pytest -m integration

      - name: Execute default tutorial from a clean bootstrap directory
        env:
          DIMER_TUTORIAL_REF: ${{ github.sha }}
          DIMER_OUTPUT_DIR: ${{ github.workspace }}/outputs/default
        run: |
          rm -rf "${RUNNER_TEMP}/chronos-notebook-fresh"
          mkdir -p "${RUNNER_TEMP}/chronos-notebook-fresh"
          uv run python tools/run_notebook.py \
            tutorials/chronos_2_forecasting_colab.ipynb \
            --workdir "${RUNNER_TEMP}/chronos-notebook-fresh"

      - name: Execute BYOD-shaped and known-future-covariate branches
        env:
          DIMER_NOTEBOOK_CI_PREINSTALLED: "1"
          DIMER_BYOD_PATH: ${{ github.workspace }}/examples/sample-data/chronos_univariate.csv
          DIMER_RUN_COVARIATE_DEMO: "1"
          DIMER_OUTPUT_DIR: ${{ github.workspace }}/outputs/branches
        run: >-
          uv run python tools/run_notebook.py
          tutorials/chronos_2_forecasting_colab.ipynb

      - name: Upload tutorial evidence
        uses: actions/upload-artifact@v4
        with:
          name: chronos-2-live-tutorial-${{ github.sha }}
          path: outputs/
          if-no-files-found: error
