name: Refresh uv lock

on:
  push:
    branches:
      - feat/standalone-notebook
    paths:
      - pyproject.toml
      - .github/workflows/refresh-uv-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/standalone-notebook
      - uses: astral-sh/setup-uv@v5
      - run: uv lock
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh uv.lock"
          git push origin HEAD:feat/standalone-notebook
